<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0b0b0c">
<title>Musikwünsche</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #0b0b0c; overflow: hidden; font-family: "Helvetica Neue", Arial, sans-serif; -webkit-font-smoothing: antialiased; }
  .wall { position: fixed; inset: 0; display: grid; grid-template-columns: repeat(var(--cols, 3), 1fr); grid-auto-rows: calc(100vw / var(--cols, 3)); gap: 2px; }
  .wall div { background: #161718 center / cover no-repeat; }
  .shade { position: fixed; inset: 0; background: radial-gradient(circle at center, rgba(0,0,0,.25) 0%, rgba(0,0,0,.7) 75%); }
  .center { position: fixed; inset: 0; display: grid; place-items: center; }
  a.spin { display: inline-flex; align-items: center; gap: 14px; padding: 18px 30px 18px 18px; background: #2d9bff; color: #fff; text-decoration: none; font-size: 20px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; border-radius: 999px; box-shadow: 0 10px 40px rgba(45,155,255,.45), 0 0 0 6px rgba(255,255,255,.12); }
  a.spin:active { transform: scale(.97); }
  .disc { width: 38px; height: 38px; border-radius: 50%; background: radial-gradient(circle, #2d9bff 0 18%, #0b0b0c 19% 22%, #222 23% 100%); box-shadow: inset 0 0 0 2px #333; animation: rot 2.4s linear infinite; position: relative; }
  .disc::after { content: ""; position: absolute; inset: 6px; border-radius: 50%; border: 1px solid rgba(255,255,255,.12); }
  @keyframes rot { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .disc { animation: none; } }
</style>
</head>
<body>
<div class="wall" id="wall" aria-hidden="true"></div>
<div class="shade"></div>
<div class="center">
  <a class="spin" href="wunsch.html"><span class="disc"></span>Spin it, babe</a>
</div>
<script>
// Fotos im Ordner "fotos/" ablegen und hier eintragen (quadratisch, 1:1)
const PHOTOS = ["fotos/dj1.jpg", "fotos/dj3.jpg", "fotos/schwerin.jpg", "fotos/dj4.jpg", "fotos/dj2.jpg", "fotos/dj5.jpg", "fotos/dj6.jpg"];

const wall = document.getElementById("wall");
function build() {
  const w = innerWidth, h = innerHeight;
  const cols = PHOTOS.length === 1 ? 1 : (w < 600 ? 3 : w < 1100 ? 5 : 7);
  wall.style.setProperty("--cols", cols);
  const tile = w / cols, rows = Math.ceil(h / tile) + 1;
  // Bei genau einem Foto: Vollbild statt Kacheln
  if (PHOTOS.length === 1) { wall.style.gridAutoRows = "100vh"; }
  wall.innerHTML = "";
  for (let i = 0; i < cols * (PHOTOS.length === 1 ? 1 : rows); i++) {
    const d = document.createElement("div");
    // Versatz pro Zeile, damit gleiche Fotos nicht untereinander stehen
    if (PHOTOS.length) d.style.backgroundImage = `url("${PHOTOS[(i % cols + Math.floor(i / cols)) % PHOTOS.length]}")`;
    wall.appendChild(d);
  }
}
build();
addEventListener("resize", build);
</script>
</body>
</html>
