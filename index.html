<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Musikwünsche</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif; background: #EEF3FB; color: #1E2A5A; }
  main { max-width: 480px; margin: 0 auto; padding: 24px 20px 48px; }
  .lang { display: flex; justify-content: flex-end; gap: 4px; }
  .lang button { background: #fff; border: 1px solid #1E2A5A; padding: 6px 10px; font-size: 13px; cursor: pointer; color: #1E2A5A; }
  .lang button.on { background: #1E2A5A; color: #fff; }
  h1 { font-size: 40px; line-height: 1.05; margin: 32px 0 8px; letter-spacing: -0.02em; }
  p.sub { margin: 0 0 32px; color: #5B6684; font-size: 16px; }
  label { display: block; font-weight: 600; font-size: 14px; margin: 20px 0 6px; }
  label span { font-weight: 400; color: #7A84A0; }
  input, textarea { width: 100%; font: inherit; font-size: 17px; padding: 14px; border: 2px solid #1E2A5A; border-radius: 0; background: #fff; color: #1E2A5A; }
  textarea { min-height: 90px; resize: vertical; }
  input:focus, textarea:focus { outline: none; border-color: #1E2A5A; box-shadow: 4px 4px 0 #FF8A65; }
  .hp { position: absolute; left: -9999px; }
  button.send { width: 100%; margin-top: 28px; padding: 16px; font-size: 18px; font-weight: 700; background: #1E2A5A; color: #fff; border: 2px solid #1E2A5A; cursor: pointer; }
  button.send:disabled { opacity: .5; }
  .err { color: #b00; margin-top: 12px; font-size: 14px; min-height: 1em; }
  .done { display: none; text-align: center; margin-top: 64px; }
  .done .big { font-size: 64px; color: #FF8A65; }
  .done button { margin-top: 24px; background: #fff; color: #1E2A5A; }
</style>
</head>
<body>
<main>
  <div class="lang">
    <button type="button" data-l="de" class="on">DE</button>
    <button type="button" data-l="en">EN</button>
  </div>

  <form id="f" novalidate>
    <h1 data-t="title"></h1>
    <p class="sub" data-t="sub"></p>

    <label for="song"><span data-t="song" style="color:#1E2A5A;font-weight:600"></span> *</label>
    <input id="song" name="song" maxlength="200" required autocomplete="off">

    <label for="artist"><span data-t="artist" style="color:#1E2A5A;font-weight:600"></span> *</label>
    <input id="artist" name="artist" maxlength="200" required autocomplete="off">

    <label for="note"><span data-t="note" style="color:#1E2A5A;font-weight:600"></span> <span data-t="optional"></span></label>
    <textarea id="note" name="note" maxlength="500"></textarea>

    <input class="hp" id="website" name="website" tabindex="-1" autocomplete="off" aria-hidden="true">

    <button class="send" id="send" type="submit" data-t="send"></button>
    <div class="err" id="err"></div>
  </form>

  <div class="done" id="done">
    <div class="big">✓</div>
    <h1 data-t="thanks"></h1>
    <p class="sub" data-t="thanksSub"></p>
    <button class="send" id="again" type="button" data-t="again"></button>
  </div>
</main>

<script>
const SUPABASE_URL = "https://defcfwoxjspomkrfarpd.supabase.co";
const SUPABASE_KEY = "sb_publishable_DFW0nw2uSWbRvTqVZkz-Xw_wSHDvk7k";

const T = {
  de: { title: "Musikwünsche?", sub: "Sag uns, was du hören willst.", song: "Song", artist: "Künstler / Band",
        note: "Anmerkung", optional: "(optional)", send: "Wunsch abschicken", sending: "Wird gesendet …",
        missing: "Bitte Song und Künstler ausfüllen.", fail: "Hat nicht geklappt. Bitte nochmal versuchen.",
        thanks: "Danke!", thanksSub: "Dein Wunsch ist beim DJ angekommen.", again: "Noch ein Wunsch" },
  en: { title: "Song requests?", sub: "Tell us what you want to hear.", song: "Song", artist: "Artist / Band",
        note: "Note", optional: "(optional)", send: "Send request", sending: "Sending …",
        missing: "Please fill in song and artist.", fail: "Something went wrong. Please try again.",
        thanks: "Thanks!", thanksSub: "Your request reached the DJ.", again: "Another request" }
};
let lang = "de";
try { if (localStorage.getItem("lang") === "en") lang = "en"; } catch (e) {}

function render() {
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-t]").forEach(el => el.textContent = T[lang][el.dataset.t]);
  document.querySelectorAll(".lang button").forEach(b => b.classList.toggle("on", b.dataset.l === lang));
  document.title = T[lang].title;
}
document.querySelectorAll(".lang button").forEach(b => b.onclick = () => {
  lang = b.dataset.l; try { localStorage.setItem("lang", lang); } catch (e) {} render();
});
render();

const f = document.getElementById("f"), send = document.getElementById("send"), err = document.getElementById("err");
f.addEventListener("submit", async (e) => {
  e.preventDefault();
  err.textContent = "";
  const song = f.song.value.trim(), artist = f.artist.value.trim(), note = f.note.value.trim();
  if (f.website.value) return; // Spam-Bot
  if (!song || !artist) { err.textContent = T[lang].missing; return; }
  send.disabled = true; send.textContent = T[lang].sending;
  try {
    const r = await fetch(SUPABASE_URL + "/rest/v1/requests", {
      method: "POST",
      headers: { "apikey": SUPABASE_KEY, "Content-Type": "application/json", "Prefer": "return=minimal" },
      body: JSON.stringify({ song, artist, note: note || null })
    });
    if (!r.ok) throw new Error(r.status);
    f.reset(); f.style.display = "none"; document.getElementById("done").style.display = "block";
  } catch (x) {
    err.textContent = T[lang].fail;
  } finally {
    send.disabled = false; send.textContent = T[lang].send;
  }
});
document.getElementById("again").onclick = () => {
  document.getElementById("done").style.display = "none"; f.style.display = "block"; f.song.focus();
};
</script>
</body>
</html>
