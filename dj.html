<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>DJ – Musikwünsche</title>
<style>
  * { box-sizing: border-box; }
  :root { --bg:#0b0b0c; --panel:#161718; --row:#1c1d1f; --row2:#151617; --line:#2a2b2e; --text:#e9e9ea; --dim:#8b8d92; --acc:#2d9bff; }
  body { margin: 0; font-family: "Helvetica Neue", Arial, sans-serif; background: var(--bg); color: var(--text); -webkit-font-smoothing: antialiased; }
  main { max-width: 820px; margin: 0 auto; padding: 14px 12px 48px; }
  header { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; padding: 6px 4px 10px; border-bottom: 1px solid var(--line); }
  h1 { font-size: 15px; margin: 0; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--text); }
  h1::before { content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--acc); margin-right: 10px; vertical-align: 1px; box-shadow: 0 0 8px var(--acc); }
  .meta { font-size: 12px; color: var(--dim); font-variant-numeric: tabular-nums; letter-spacing: .04em; }
  .event { display: flex; gap: 6px; margin-top: 12px; }
  .event select { flex: 1; min-width: 0; font: inherit; font-size: 15px; font-weight: 600; padding: 10px; border: 1px solid var(--line); border-radius: 3px; background: var(--panel); color: var(--text); }
  .event button { font: inherit; font-size: 16px; padding: 0 14px; flex: none; border: 1px solid var(--line); border-radius: 3px; background: var(--panel); color: var(--dim); cursor: pointer; }
  .tabs { display: flex; gap: 4px; margin: 8px 0 10px; }
  .tabs button { flex: 1; padding: 9px; font: inherit; font-size: 12px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; background: var(--panel); color: var(--dim); border: 1px solid var(--line); border-radius: 3px; cursor: pointer; }
  .tabs button.on { background: var(--acc); border-color: var(--acc); color: #fff; }
  .cols { display: grid; grid-template-columns: 34px 1fr 52px; gap: 10px; padding: 6px 10px; font-size: 10px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--dim); background: var(--panel); border: 1px solid var(--line); border-bottom: 0; border-radius: 3px 3px 0 0; }
  .cols span:last-child { text-align: right; }
  ul { list-style: none; margin: 0; padding: 0; border: 1px solid var(--line); border-radius: 0 0 3px 3px; overflow: hidden; }
  li { display: grid; grid-template-columns: 34px 1fr 52px; gap: 10px; align-items: center; padding: 10px; background: var(--row); }
  li:nth-child(even) { background: var(--row2); }
  li.played .song, li.played .artist { color: #5d5f64; }
  input[type=checkbox] { appearance: none; -webkit-appearance: none; width: 22px; height: 22px; margin: 0; border: 1.5px solid #4a4c51; border-radius: 3px; background: #0f1011; cursor: pointer; display: grid; place-content: center; }
  input[type=checkbox]::after { content: ""; width: 10px; height: 6px; border: solid #fff; border-width: 0 0 2.5px 2.5px; transform: rotate(-45deg) translate(1px,-1px); opacity: 0; }
  input[type=checkbox]:checked { background: var(--acc); border-color: var(--acc); }
  input[type=checkbox]:checked::after { opacity: 1; }
  .song { font-size: 15px; font-weight: 600; color: var(--text); }
  .artist { font-size: 13px; color: var(--dim); margin-top: 2px; }
  .note { font-size: 12px; color: var(--acc); margin-top: 4px; }
  .time { font-size: 12px; color: var(--dim); text-align: right; font-variant-numeric: tabular-nums; }
  .time small { display: block; color: #5d5f64; font-size: 10px; }
  .txt { min-width: 0; overflow-wrap: anywhere; }
  ul:empty { display: none; }
  .empty, .msg { text-align: center; color: var(--dim); padding: 48px 0; font-size: 14px; }
  .msg.bad { color: #ff5a4f; }
</style>
</head>
<body>
<main>
  <header>
    <h1>Musikwünsche</h1>
    <div class="meta" id="meta"></div>
  </header>
  <div class="event">
    <select id="event" aria-label="Event"></select>
    <button id="rename" type="button" title="Event umbenennen" aria-label="Event umbenennen">✎</button>
  </div>
  <div class="tabs">
    <button data-f="open" class="on">Offen</button>
    <button data-f="played">Gespielt</button>
    <button data-f="all">Alle</button>
  </div>
  <div class="cols"><span>✓</span><span>Titel / Künstler</span><span>Zeit</span></div>
  <ul id="list"></ul>
  <div class="msg" id="msg">Lädt …</div>
</main>

<script>
const SUPABASE_URL = "https://defcfwoxjspomkrfarpd.supabase.co";
const SUPABASE_KEY = "sb_publishable_DFW0nw2uSWbRvTqVZkz-Xw_wSHDvk7k";

let token = new URLSearchParams(location.search).get("k");
try {
  if (token) localStorage.setItem("djtoken", token);
  else token = localStorage.getItem("djtoken");
} catch (e) {}

let rows = [], filter = "open", busy = false;
const list = document.getElementById("list"), msg = document.getElementById("msg"), meta = document.getElementById("meta");

async function rpc(fn, body) {
  const r = await fetch(SUPABASE_URL + "/rest/v1/rpc/" + fn, {
    method: "POST",
    headers: { "apikey": SUPABASE_KEY, "Content-Type": "application/json" },
    body: JSON.stringify(body)
  });
  if (!r.ok) { const e = new Error("HTTP " + r.status); e.status = r.status; throw e; }
  const t = await r.text(); return t ? JSON.parse(t) : null;
}

function esc(s) { return String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function hhmm(d) { return new Date(d).toLocaleTimeString("de-DE", { hour: "2-digit", minute: "2-digit" }); }

let events = [], current = null;
const sel = document.getElementById("event");

// Partytag = 07:00 bis 07:00 Uhr (Berliner Zeit)
function todayEvent() {
  const d = new Date(Date.now() - 7 * 3600 * 1000);
  return d.toLocaleDateString("sv-SE", { timeZone: "Europe/Berlin" });
}
function fmtDate(d) { const [y, m, t] = d.split("-"); return t + "." + m + "." + y; }

function renderEvents() {
  if (!current || !events.some(e => e.event_date === current)) {
    const today = todayEvent();
    const upcoming = events.filter(e => e.event_date >= today).sort((a, b) => a.event_date < b.event_date ? -1 : 1)[0];
    current = (upcoming || events[0] || {}).event_date || null;
  }
  sel.innerHTML = events.map(e =>
    `<option value="${e.event_date}" ${e.event_date === current ? "selected" : ""}>${esc(e.name)}</option>`
  ).join("");
}
sel.onchange = () => { current = sel.value; render(); };

document.getElementById("rename").onclick = async () => {
  const ev = events.find(e => e.event_date === current); if (!ev) return;
  const name = prompt("Neuer Name für das Event:", ev.name);
  if (!name || !name.trim()) return;
  try { await rpc("dj_rename_event", { token, d: current, new_name: name.trim() }); ev.name = name.trim(); render(); }
  catch (x) { alert("Umbenennen fehlgeschlagen."); }
};

function render() {
  renderEvents();
  const evRows = rows.filter(r => r.event_date === current);
  const open = evRows.filter(r => !r.played).length;
  meta.textContent = open + " offen · " + (evRows.length - open) + " gespielt";
  const shown = evRows.filter(r => filter === "all" || (filter === "open" ? !r.played : r.played));
  list.innerHTML = shown.map(r => `
    <li class="${r.played ? "played" : ""}">
      <input type="checkbox" data-id="${r.id}" ${r.played ? "checked" : ""} aria-label="Gespielt">
      <div class="txt">
        <div class="song">${esc(r.song)}</div>
        <div class="artist">${esc(r.artist)}</div>
        ${r.note ? `<div class="note">${esc(r.note)}</div>` : ""}
      </div>
      <div class="time">${hhmm(r.created_at)}${r.played && r.played_at ? `<small>▶ ${hhmm(r.played_at)}</small>` : ""}</div>
    </li>`).join("");
  document.querySelector(".cols").style.display = shown.length ? "" : "none";
  msg.className = "msg";
  msg.textContent = shown.length ? "" : (filter === "played" ? "Noch nichts gespielt." : "Keine Wünsche.");
  msg.style.display = shown.length ? "none" : "block";
}

async function load() {
  if (busy) return;
  try {
    [rows, events] = await Promise.all([rpc("dj_list", { token }), rpc("dj_events", { token })]);
    render();
  } catch (e) {
    msg.style.display = "block"; msg.className = "msg bad";
    msg.textContent = e.status === 400 ? "Ungültiger Link." : "Keine Verbindung – versuche es gleich wieder …";
  }
}

list.addEventListener("change", async (e) => {
  if (e.target.type !== "checkbox") return;
  const id = Number(e.target.dataset.id), played = e.target.checked;
  const row = rows.find(r => r.id === id);
  busy = true;
  row.played = played; row.played_at = played ? new Date().toISOString() : null; render();
  try { await rpc("dj_set_played", { token, request_id: id, is_played: played }); }
  catch (x) { row.played = !played; render(); alert("Speichern fehlgeschlagen."); }
  busy = false;
});

document.querySelectorAll(".tabs button").forEach(b => b.onclick = () => {
  filter = b.dataset.f;
  document.querySelectorAll(".tabs button").forEach(x => x.classList.toggle("on", x === b));
  render();
});

if (!token) { msg.className = "msg bad"; msg.textContent = "Dieser Link ist unvollständig."; }
else { load(); setInterval(load, 10000); }
</script>
</body>
</html>
